<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Menaxhim Makinash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Menaxhim Makinash 🚗</h1>

  <div class="container">

    <h2>Shto makinë të re</h2>

    <div class="form">
      <input id="model" type="text" placeholder="Modeli">
      <input id="year" type="number" placeholder="Viti">
      <input id="price" type="number" placeholder="Çmimi (€)">
      <button onclick="addCar()">Shto</button>
    </div>

    <h2>Lista e makinave</h2>
    <div id="car-list"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
